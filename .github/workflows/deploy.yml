name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Parts of the site are computed against build time, not read at request time:
  # src/data/teaching.ts hides course sessions once they have run and badges
  # talks as upcoming until their date passes, and posts scheduled with a future
  # pubDatetime stay hidden until a build sees them. On a push-only trigger an
  # expired session or a stale "upcoming" badge sits there until the next commit
  # happens to land. A daily rebuild bounds that staleness to 24 hours.
  # Cron runs on UTC, which does not observe the Pacific DST shift the sessions
  # are scheduled against. 07:10 UTC is 00:10 PDT but 23:10 PST the day before,
  # so half the year it ran before the Pacific midnight it was aiming past and a
  # session stayed listed through the morning after it ran. 08:10 UTC is after
  # midnight Pacific in both offsets (00:10 PST / 01:10 PDT).
  schedule:
    - cron: "10 8 * * *"
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        env:
          GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}
        # with:
          # path: . # The root location of your Astro project inside the repository. (optional)
          # node-version: 24 # The specific version of Node that should be used to build your site. Defaults to 24. (optional)
          # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4